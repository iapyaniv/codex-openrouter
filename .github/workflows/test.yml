name: Check
on: [push, pull_request, workflow_call]
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
  GOPROXY: "off"
  GOENV: "off"
  GOWORK: "off"
  GOFLAGS: ""
  GOEXPERIMENT: ""
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: false
          cache: false
      - name: Format, dependency boundary, vet and tests
        run: |
          test -z "$(gofmt -l cmd internal)"
          test "$(go list -m all)" = codex-openrouter
          external="$(go list -deps -f '{{if not .Standard}}{{if not .Module.Main}}{{.ImportPath}}{{end}}{{end}}' ./...)"
          test -z "$(printf '%s' "$external" | tr -d '\r\n')"
          go vet ./...
          go test -count=1 ./...
      - name: Race checks
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: go test -race -count=1 ./...
  cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: false
          cache: false
      - name: Compile application and tests for six targets
        env:
          CGO_ENABLED: "0"
          GOAMD64: v1
          GOARM64: v8.0
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/codex-openrouter-${GOOS}-${GOARCH}" ./cmd/codex-openrouter
            go test -exec=/usr/bin/true -run='^$' ./...
          done
  native-install:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: false
          cache: false
      - name: Install over HTTPS and exercise the public command
        env:
          CODEX_OPENROUTER_TEST_INSTALL: "1"
        run: |
          test "$(uname -m)" = arm64
          go test -count=1 -v ./internal/integration
